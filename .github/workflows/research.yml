name: Research workspace
on:
  push:
    branches: [main]
    paths-ignore: ["archive/**"]
  pull_request:
    paths-ignore: ["archive/**"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: trading
          POSTGRES_DB: trading
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trading" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TRADING_DATABASE_URL: postgresql://trading@127.0.0.1:5432/trading
      TRADING_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
