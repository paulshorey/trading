[project]
name = "backtest-runner"
version = "0.2.0"
description = "Databento data adapters, run orchestration, CLI, and local research API"
requires-python = ">=3.13"
dependencies = [
    "databento>=0.89",
    "numpy>=2.3",
    "pandas-market-calendars>=5.6",
    "psycopg[binary]>=3.2",
    "strategy-core",
]

[project.scripts]
research = "backtest_runner.cli:main"

[tool.uv.sources]
strategy-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
